name: GLG live data (men)

# Scrapes completed Global Lacrosse Games results + box scores and publishes them to the public
# `glg-live` release, which the local GLG projections app syncs from every few minutes.
# Manual by design: the app's "Scrape latest GLG stats" button commits a timestamp to glg_trigger.txt on this
# branch, which starts this run (~1 min). Also runs when the scraper or this workflow changes.
on:
  workflow_dispatch:
  push:
    branches: [sixes-data]
    paths: ['glg_trigger.txt', 'scripts/sixes/scrape_glg_live.py', '.github/workflows/glg-live.yml']

permissions:
  contents: write

concurrency:
  group: glg-live
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLL_BEARER_TOKEN: ${{ secrets.PLL_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sixes-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Scrape GLG
        run: python scripts/sixes/scrape_glg_live.py
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view glg-live >/dev/null 2>&1 || \
            gh release create glg-live --target sixes-data --prerelease --title "GLG live data (men)" \
              --notes "Completed Global Lacrosse Games results and box scores; refreshed by .github/workflows/glg-live.yml."
          gh release upload glg-live glg_live/results.csv glg_live/player_box.csv glg_live/team_box.csv glg_live/status.json --clobber
